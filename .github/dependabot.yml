version: 2
multi-ecosystem-groups:
  weekly-dependencies:
    open-pull-requests-limit: 1
    schedule:
      interval: weekly
updates:
  - package-ecosystem: npm
    directory: /
    patterns:
      - "*"
    multi-ecosystem-group: weekly-dependencies
    ignore:
      # TypeScript 7 removes compiler APIs used by the package smoke gate.
      # Upgrade it deliberately with the consuming build scripts.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
  - package-ecosystem: cargo
    directory: /
    patterns:
      - "*"
    multi-ecosystem-group: weekly-dependencies
    ignore:
      # napi-derive minor releases must move with the compatible napi runtime.
      - dependency-name: napi-derive
        update-types:
          - version-update:semver-minor
  - package-ecosystem: github-actions
    directory: /
    patterns:
      - "*"
    multi-ecosystem-group: weekly-dependencies

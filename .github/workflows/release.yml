name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  actions: read
  contents: read

jobs:
  prebuild:
    name: Prebuild ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.13.0
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}
      - if: matrix.target == 'aarch64-apple-darwin'
        run: test "$(uname -m)" = arm64
      - if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y patchelf
      - run: node scripts/assert-supported-targets.cjs
      - run: npm ci
      - name: Run full test gate
        run: npm test
      - run: npm run build
      - if: matrix.target != 'x86_64-pc-windows-msvc'
        run: npx napi build --release --target ${{ matrix.target }} --platform --no-js --manifest-path crates/native/Cargo.toml --package-json-path packages/steam-bridge/package.json --output-dir packages/steam-bridge
      - name: Build exact Windows native addon
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |
          cargo build --release --target x86_64-pc-windows-msvc -p steam-bridge-native
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $nativeDll = "target/x86_64-pc-windows-msvc/release/steam_bridge_native.dll"
          $addon = "packages/steam-bridge/steam_bridge_native.win32-x64-msvc.node"
          Copy-Item -LiteralPath $nativeDll -Destination $addon
          if ((Get-FileHash -LiteralPath $nativeDll -Algorithm SHA256).Hash -ne
              (Get-FileHash -LiteralPath $addon -Algorithm SHA256).Hash) {
            throw "The Windows addon differs from the exact Cargo output"
          }
      - name: Verify exact Windows addon and PDB pair
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |
          node scripts/verify-windows-native-symbols.cjs `
            --addon packages/steam-bridge/steam_bridge_native.win32-x64-msvc.node `
            --pdb target/x86_64-pc-windows-msvc/release/steam_bridge_native.pdb
      - name: Retain exact Windows PDB
        if: matrix.target == 'x86_64-pc-windows-msvc'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # Keep symbols outside the steam-bridge-* namespace consumed by
          # release-artifact assembly. The PDB never enters the npm package.
          name: native-symbols-windows-${{ github.sha }}
          path: target/x86_64-pc-windows-msvc/release/steam_bridge_native.pdb
          if-no-files-found: error
      - name: Retain exact unsigned Windows addon
        if: matrix.target == 'x86_64-pc-windows-msvc'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-unsigned-windows-${{ github.sha }}
          path: packages/steam-bridge/steam_bridge_native.win32-x64-msvc.node
          if-no-files-found: error
      - name: Verify exact Windows release tag
        if: github.ref_type == 'tag' && matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |
          if ((git rev-list -n 1 $env:GITHUB_REF_NAME) -ne $env:GITHUB_SHA) {
            throw "Windows addon must come from the exact immutable release tag"
          }
          $packageVersion = node -p "require('./packages/steam-bridge/package.json').version"
          if ("v$packageVersion" -ne $env:GITHUB_REF_NAME) {
            throw "Package version does not match the release tag"
          }
          $addon = "packages\steam-bridge\steam_bridge_native.win32-x64-msvc.node"
          if (!(Test-Path -LiteralPath $addon -PathType Leaf)) {
            throw "The exact Windows prebuild addon is missing"
          }
          Get-FileHash -LiteralPath $addon -Algorithm SHA256
      - run: node packages/steam-bridge/scripts/link-native.cjs --runtime-only --target ${{ matrix.target }}
      - run: node scripts/verify-release-artifacts.cjs --target ${{ matrix.target }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: steam-bridge-${{ matrix.target }}
          path: |
            packages/steam-bridge/*.node
            packages/steam-bridge/libsteam_api.*
            packages/steam-bridge/libsdkencryptedappticket.*
            packages/steam-bridge/steam_api*.dll
            packages/steam-bridge/sdkencryptedappticket*.dll

  sign-windows-addon:
    name: Sign Windows native addon
    needs: prebuild
    if: github.ref_type == 'tag'
    runs-on: windows-latest
    environment: windows-signing
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      ADDON_ARTIFACT_DIR: windows-signing/steam-bridge-x86_64-pc-windows-msvc
      EXPECTED_PUBLISHER: Pixel Games LLC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.13.0
          package-manager-cache: false
      - name: Download exact unsigned Windows prebuild
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: steam-bridge-x86_64-pc-windows-msvc
          path: windows-signing/steam-bridge-x86_64-pc-windows-msvc
      - name: Record exact unsigned Windows prebuild
        shell: pwsh
        run: |
          $expected = @("sdkencryptedappticket64.dll", "steam_api64.dll", "steam_bridge_native.win32-x64-msvc.node") | Sort-Object
          $entries = @(Get-ChildItem -LiteralPath $env:ADDON_ARTIFACT_DIR -Force)
          if ((@($entries.Name | Sort-Object) -join "|") -ne ($expected -join "|") -or
              @($entries | Where-Object { $_.PSIsContainer -or $_.Length -eq 0 }).Count -ne 0) {
            throw "The Windows prebuild artifact must contain exactly the addon and both Valve DLLs"
          }
          $addon = Join-Path $env:ADDON_ARTIFACT_DIR "steam_bridge_native.win32-x64-msvc.node"
          if ((Get-AuthenticodeSignature -LiteralPath $addon).Status -ne "NotSigned") {
            throw "The signing input must be the exact unsigned prebuild addon"
          }
          foreach ($dllName in @("steam_api64.dll", "sdkencryptedappticket64.dll")) {
            $dllSignature = Get-AuthenticodeSignature -LiteralPath (Join-Path $env:ADDON_ARTIFACT_DIR $dllName)
            if ($dllSignature.Status -ne "Valid") {
              throw "$dllName must retain Valve's valid Authenticode signature"
            }
          }
          node scripts/verify-release-artifacts.cjs --target x86_64-pc-windows-msvc --package-dir $env:ADDON_ARTIFACT_DIR
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $reference = Join-Path $env:RUNNER_TEMP "steam-bridge-unsigned-prebuild"
          New-Item -ItemType Directory -Path $reference | Out-Null
          foreach ($fileName in $expected) {
            Copy-Item -LiteralPath (Join-Path $env:ADDON_ARTIFACT_DIR $fileName) -Destination (Join-Path $reference $fileName)
          }
          Get-ChildItem -LiteralPath $reference -File |
            ForEach-Object { Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256 } |
            Format-Table -AutoSize Hash, Path
      - name: Sign in to Azure with GitHub OIDC
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Sign exact Windows addon with Azure Artifact Signing
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: https://eus.codesigning.azure.net
          signing-account-name: pixelgames-signing
          certificate-profile-name: pixelgames-public
          files: ${{ github.workspace }}\windows-signing\steam-bridge-x86_64-pc-windows-msvc\steam_bridge_native.win32-x64-msvc.node
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          cache-dependencies: false
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true
      - name: Sign out of Azure
        if: always()
        run: az account clear
      - name: Verify signed Windows addon
        shell: pwsh
        run: |
          $addonName = "steam_bridge_native.win32-x64-msvc.node"
          $expected = @("sdkencryptedappticket64.dll", "steam_api64.dll", $addonName) | Sort-Object
          $entries = @(Get-ChildItem -LiteralPath $env:ADDON_ARTIFACT_DIR -Force)
          if ((@($entries.Name | Sort-Object) -join "|") -ne ($expected -join "|") -or
              @($entries | Where-Object { $_.PSIsContainer -or $_.Length -eq 0 }).Count -ne 0) {
            throw "Signing must leave exactly the addon and both Valve DLLs"
          }
          $reference = Join-Path $env:RUNNER_TEMP "steam-bridge-unsigned-prebuild"
          $addon = Join-Path $env:ADDON_ARTIFACT_DIR $addonName
          $signature = Get-AuthenticodeSignature -LiteralPath $addon
          if ($signature.Status -ne "Valid") {
            throw "Signed addon Authenticode status is $($signature.Status): $($signature.StatusMessage)"
          }
          $signer = $signature.SignerCertificate
          if (-not $signer) {
            throw "Signed addon has no signer certificate"
          }
          $subjectNames = @($signer.SubjectName.EnumerateRelativeDistinguishedNames())
          foreach ($oid in @("2.5.4.3", "2.5.4.10")) {
            $values = @($subjectNames |
              Where-Object { $_.GetSingleElementType().Value -eq $oid } |
              ForEach-Object { $_.GetSingleElementValue() })
            if ($values.Count -ne 1 -or $values[0] -cne $env:EXPECTED_PUBLISHER) {
              throw "Signed addon subject attribute $oid must be exactly $($env:EXPECTED_PUBLISHER): $($signer.Subject)"
            }
          }
          if ($signer.Subject.IndexOf("CN=$($env:EXPECTED_PUBLISHER)", [StringComparison]::OrdinalIgnoreCase) -lt 0) {
            throw "Signed addon subject does not contain the package gate publisher subject: $($signer.Subject)"
          }
          $codeSigningUsages = @($signer.Extensions |
            Where-Object { $_ -is [System.Security.Cryptography.X509Certificates.X509EnhancedKeyUsageExtension] } |
            ForEach-Object { $_.EnhancedKeyUsages } |
            Where-Object { $_.Value -eq "1.3.6.1.5.5.7.3.3" })
          if ($codeSigningUsages.Count -eq 0) {
            throw "Signed addon signer has no code-signing EKU"
          }
          if (-not $signature.TimeStamperCertificate) {
            throw "Signed addon has no RFC 3161 timestamp"
          }
          foreach ($dllName in @("steam_api64.dll", "sdkencryptedappticket64.dll")) {
            if ((Get-FileHash -LiteralPath (Join-Path $reference $dllName) -Algorithm SHA256).Hash -ne
                (Get-FileHash -LiteralPath (Join-Path $env:ADDON_ARTIFACT_DIR $dllName) -Algorithm SHA256).Hash) {
              throw "$dllName changed during addon signing"
            }
          }
          if ((Get-FileHash -LiteralPath (Join-Path $reference $addonName) -Algorithm SHA256).Hash -eq
              (Get-FileHash -LiteralPath $addon -Algorithm SHA256).Hash) {
            throw "Signing did not change the addon bytes"
          }
          $env:UNSIGNED_REFERENCE_DIR = $reference
          node -e "const v = require('./scripts/verify-windows-packaged-artifacts.cjs'); v.assertMatchingRuntimeFiles(v.inspectWindowsRuntimeDirectory(process.env.UNSIGNED_REFERENCE_DIR), v.inspectWindowsRuntimeDirectory(process.env.ADDON_ARTIFACT_DIR), 'unsigned prebuild', 'signed prebuild', { allowAuthenticodeChanges: true }); console.log('Signed addon preserves the exact unsigned PE content.');"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Output "Signer: $($signer.Subject) thumbprint=$($signer.Thumbprint)"
          Write-Output "Timestamp: $($signature.TimeStamperCertificate.Subject)"
          Get-ChildItem -LiteralPath $env:ADDON_ARTIFACT_DIR -File |
            ForEach-Object { Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256 } |
            Format-Table -AutoSize Hash, Path
      - name: Replace Windows prebuild with signed addon
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: steam-bridge-x86_64-pc-windows-msvc
          path: |
            windows-signing/steam-bridge-x86_64-pc-windows-msvc/*.node
            windows-signing/steam-bridge-x86_64-pc-windows-msvc/libsteam_api.*
            windows-signing/steam-bridge-x86_64-pc-windows-msvc/libsdkencryptedappticket.*
            windows-signing/steam-bridge-x86_64-pc-windows-msvc/steam_api*.dll
            windows-signing/steam-bridge-x86_64-pc-windows-msvc/sdkencryptedappticket*.dll
          if-no-files-found: error
          overwrite: true

  windows-package-gate:
    name: Windows publish-tarball ASAR gate
    needs: [prebuild, sign-windows-addon]
    if: >-
      !cancelled() &&
      needs.prebuild.result == 'success' &&
      (needs.sign-windows-addon.result == 'success' ||
      (github.ref_type != 'tag' && needs.sign-windows-addon.result == 'skipped'))
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.13.0
          cache: npm
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: steam-bridge-*
          path: release-artifacts
      - run: npm ci
      - run: npm run check:electron
      - run: node scripts/assemble-release-artifacts.cjs --artifacts-dir release-artifacts
      - name: Download exact Windows PDB
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-symbols-windows-${{ github.sha }}
          path: native-symbols-windows
      - name: Verify assembled Windows addon and PDB pair
        shell: pwsh
        run: |
          node scripts/verify-windows-native-symbols.cjs `
            --addon packages/steam-bridge/steam_bridge_native.win32-x64-msvc.node `
            --pdb native-symbols-windows/steam_bridge_native.pdb
      - name: Download exact unsigned Windows addon
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-unsigned-windows-${{ github.sha }}
          path: native-unsigned-windows
      - name: Verify assembled Windows addon against unsigned prebuild
        shell: pwsh
        env:
          UNSIGNED_ADDON: native-unsigned-windows/steam_bridge_native.win32-x64-msvc.node
          ASSEMBLED_ADDON: packages/steam-bridge/steam_bridge_native.win32-x64-msvc.node
        run: |
          if (@(Get-ChildItem -LiteralPath native-unsigned-windows -Force).Count -ne 1 -or
              (Get-AuthenticodeSignature -LiteralPath $env:UNSIGNED_ADDON).Status -ne "NotSigned") {
            throw "The retained Windows addon reference must be exactly the unsigned prebuild addon"
          }
          node -e "const fs = require('node:fs'); const { authenticodeContentSha256 } = require('./scripts/verify-windows-packaged-artifacts.cjs'); const unsigned = authenticodeContentSha256(fs.readFileSync(process.env.UNSIGNED_ADDON), 'unsigned prebuild addon'); const assembled = authenticodeContentSha256(fs.readFileSync(process.env.ASSEMBLED_ADDON), 'assembled addon'); if (unsigned !== assembled) { throw new Error('Assembled Windows addon PE content differs from the unsigned prebuild: ' + unsigned + ' != ' + assembled); } console.log('Assembled Windows addon preserves unsigned prebuild PE content ' + unsigned);"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($env:GITHUB_REF_TYPE -ne "tag" -and
              (Get-FileHash -LiteralPath $env:UNSIGNED_ADDON -Algorithm SHA256).Hash -ne
              (Get-FileHash -LiteralPath $env:ASSEMBLED_ADDON -Algorithm SHA256).Hash) {
            throw "An unsigned dry run must assemble the exact unsigned prebuild addon"
          }
      - name: Restore proved runtime payload for documentation-only v0.1.6
        if: github.event_name == 'push' && github.ref_name == 'v0.1.6'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_RELEASE_TAG: v0.1.4
        run: |
          $previousRoot = "documentation-only-previous"
          New-Item -ItemType Directory -Path $previousRoot | Out-Null
          if ((gh release view $env:PREVIOUS_RELEASE_TAG --json isDraft --jq .isDraft) -ne "false") {
            throw "Documentation-only predecessor must be a published GitHub Release."
          }
          if ((gh release view $env:PREVIOUS_RELEASE_TAG --json isPrerelease --jq .isPrerelease) -ne "false") {
            throw "Documentation-only predecessor must be stable."
          }
          gh release download $env:PREVIOUS_RELEASE_TAG `
            --pattern "steam-bridge-0.1.4.tgz" `
            --pattern "windows-live-proof-receipt.json" `
            --dir $previousRoot
          tar -xzf "$previousRoot\steam-bridge-0.1.4.tgz" -C $previousRoot
          $runtimeFiles = @(
            "steam_bridge_native.darwin-arm64.node",
            "steam_bridge_native.linux-x64-gnu.node",
            "steam_bridge_native.win32-x64-msvc.node",
            "libsteam_api.dylib",
            "libsteam_api.so",
            "steam_api64.dll",
            "libsdkencryptedappticket.dylib",
            "libsdkencryptedappticket.so",
            "sdkencryptedappticket64.dll"
          )
          foreach ($fileName in $runtimeFiles) {
            $source = Join-Path "$previousRoot\package" $fileName
            if (!(Test-Path -LiteralPath $source -PathType Leaf)) {
              throw "Documentation-only predecessor is missing $fileName."
            }
            Copy-Item -LiteralPath $source -Destination "packages\steam-bridge\$fileName" -Force
          }
      - name: Run exact Windows package gate
        if: github.ref_type != 'tag'
        run: npm run windows:package-gate
      - name: Run exact Windows package gate with signed native addon
        if: github.ref_type == 'tag'
        shell: cmd
        run: npm run windows:package-gate -- --require-native-addon-signed --expected-publisher-subject "CN=Pixel Games LLC"
      - name: Verify canonical npm release candidate
        shell: pwsh
        run: |
          $tarballs = @(Get-ChildItem -LiteralPath "dist\windows-electron-builder-asar" -Filter "*.tgz" -File)
          if ($tarballs.Count -ne 1) {
            throw "Expected exactly one audited npm tarball, found $($tarballs.Count)."
          }
          $bundleArchives = @(Get-ChildItem -LiteralPath "dist\windows-electron-builder-asar" -Filter "*-win-unpacked.tar" -File)
          if ($bundleArchives.Count -ne 1) {
            throw "Expected exactly one retained Windows bundle archive, found $($bundleArchives.Count)."
          }
          if ($env:GITHUB_EVENT_NAME -eq "push" -and $env:GITHUB_REF_NAME -eq "v0.1.6") {
            node scripts/publish-release-candidate.cjs `
              --tarball $tarballs[0].FullName `
              --bundle-archive $bundleArchives[0].FullName `
              --audit-manifest "dist\windows-electron-builder-asar\steam-bridge-windows-package-audit.json" `
              --previous-tarball "documentation-only-previous\steam-bridge-0.1.4.tgz" `
              --previous-live-proof-receipt "documentation-only-previous\windows-live-proof-receipt.json" `
              --previous-release-tag v0.1.4 `
              --require-publishable `
              --release-tag $env:GITHUB_REF_NAME
          } elseif ($env:GITHUB_EVENT_NAME -eq "push") {
            node scripts/publish-release-candidate.cjs `
              --tarball $tarballs[0].FullName `
              --bundle-archive $bundleArchives[0].FullName `
              --audit-manifest "dist\windows-electron-builder-asar\steam-bridge-windows-package-audit.json" `
              --require-publishable `
              --release-tag $env:GITHUB_REF_NAME
          } else {
            node scripts/publish-release-candidate.cjs `
              --tarball $tarballs[0].FullName `
              --bundle-archive $bundleArchives[0].FullName `
              --audit-manifest "dist\windows-electron-builder-asar\steam-bridge-windows-package-audit.json"
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: steam-bridge-windows-publish-package-gate
          path: |
            dist/windows-electron-builder-asar/*.tgz
            dist/windows-electron-builder-asar/*-win-unpacked.tar
            dist/windows-electron-builder-asar/steam-bridge-windows-package-audit.json
            dist/windows-electron-builder-asar/electron-native-load-result.json

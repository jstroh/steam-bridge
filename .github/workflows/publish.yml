name: Publish npm candidate

on:
  workflow_dispatch:
    inputs:
      release_run_id:
        description: Successful tag-triggered Release workflow run ID
        required: true
        type: string
      release_tag:
        description: Exact package tag, for example v0.1.0
        required: true
        type: string
      release_commit:
        description: Full immutable candidate commit SHA
        required: true
        type: string
      release_ci_run_id:
        description: Successful candidate tag-push CI run ID
        required: true
        type: string
      release_run_attempt:
        description: Exact frozen candidate Release run attempt
        required: true
        type: string
      tooling_tag:
        description: Immutable reviewed publishing-tools tag used for dispatch
        required: true
        type: string
      tooling_commit:
        description: Full reviewed publishing-tools commit SHA
        required: true
        type: string
      tooling_ci_run_id:
        description: Successful publishing-tools tag-push CI run ID
        required: true
        type: string
      npm_tag:
        description: npm dist-tag; leave empty for a stable release
        required: false
        type: string
      previous_release_tag:
        description: Prior proved release tag for an exact documentation-only patch successor
        required: false
        type: string

permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish verified npm tarball
    environment: npm-production
    runs-on: ubuntu-latest
    env:
      TOOLING_TAG: ${{ inputs.tooling_tag }}
      TOOLING_COMMIT: ${{ inputs.tooling_commit }}
      TOOLING_CI_RUN_ID: ${{ inputs.tooling_ci_run_id }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      RELEASE_COMMIT: ${{ inputs.release_commit }}
      RELEASE_RUN_ID: ${{ inputs.release_run_id }}
      RELEASE_RUN_ATTEMPT: ${{ inputs.release_run_attempt }}
      RELEASE_CI_RUN_ID: ${{ inputs.release_ci_run_id }}
    steps:
      - name: Verify dispatched tooling identity
        run: |
          [[ "$TOOLING_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          [[ "$TOOLING_TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._+-]{0,127}$ ]]
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REF_TYPE" = "tag"
          test "$GITHUB_REF_NAME" = "$TOOLING_TAG"
          test "$GITHUB_REF" = "refs/tags/$TOOLING_TAG"
          test "$GITHUB_SHA" = "$TOOLING_COMMIT"
          test "$GITHUB_WORKFLOW_SHA" = "$TOOLING_COMMIT"
          test "$GITHUB_WORKFLOW_REF" = "$GITHUB_REPOSITORY/.github/workflows/publish.yml@refs/tags/$TOOLING_TAG"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - name: Verify exact tooling and candidate epochs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node scripts/verify-publish-epochs.cjs > publish-epoch-proof.json
      - name: Install release tooling
        run: |
          node -e "const [major, minor] = require('node:child_process').execFileSync('npm', ['--version'], { encoding: 'utf8' }).trim().split('.').map(Number); if (major < 11 || (major === 11 && minor < 15)) throw new Error('npm 11.15.0 or newer is required')"
          npm ci --ignore-scripts
      - name: Download exact audited candidate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
        run: gh run download "$RELEASE_RUN_ID" --name steam-bridge-windows-publish-package-gate --dir candidate
      - name: Restore matching live-proof receipt
        if: inputs.previous_release_tag == ''
        env:
          LIVE_PROOF_GZIP_BASE64: ${{ secrets.STEAM_BRIDGE_WINDOWS_LIVE_PROOF_GZIP_BASE64 }}
        run: |
          test -n "$LIVE_PROOF_GZIP_BASE64"
          printf '%s' "$LIVE_PROOF_GZIP_BASE64" | base64 --decode > live-proof.json.gz
          gzip --test live-proof.json.gz
          gzip --decompress --stdout live-proof.json.gz > windows-live-proof-receipt.json
      - name: Restore documentation-only predecessor proof
        if: inputs.previous_release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_RELEASE_TAG: ${{ inputs.previous_release_tag }}
        run: |
          [[ "$PREVIOUS_RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(gh release view "$PREVIOUS_RELEASE_TAG" --json isDraft --jq .isDraft)" = "false"
          test "$(gh release view "$PREVIOUS_RELEASE_TAG" --json isPrerelease --jq .isPrerelease)" = "false"
          mkdir previous
          gh release download "$PREVIOUS_RELEASE_TAG" \
            --pattern 'steam-bridge-*.tgz' \
            --pattern 'windows-live-proof-receipt.json' \
            --dir previous
          mapfile -t previous_tarballs < <(find previous -type f -name 'steam-bridge-*.tgz')
          mapfile -t previous_receipts < <(find previous -type f -name 'windows-live-proof-receipt.json')
          test "${#previous_tarballs[@]}" -eq 1
          test "${#previous_receipts[@]}" -eq 1
      - name: Recheck publication source bindings
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/verify-publish-epochs.cjs --previous-proof publish-epoch-proof.json > publish-epoch-final-proof.json
      - name: Retain independent publication source bindings
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: steam-bridge-publish-epochs-${{ github.run_attempt }}
          path: |
            publish-epoch-proof.json
            publish-epoch-final-proof.json
          if-no-files-found: error
      - name: Publish exact verified bytes
        env:
          GH_TOKEN: ${{ github.token }}
          NPM_CONFIG_ACCESS: public
          NPM_CONFIG_PROVENANCE: "true"
          NPM_TAG: ${{ inputs.npm_tag }}
          PREVIOUS_RELEASE_TAG: ${{ inputs.previous_release_tag }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          node scripts/verify-publish-epochs.cjs --previous-proof publish-epoch-final-proof.json > /dev/null
          mapfile -t tarballs < <(find candidate -type f -name '*.tgz')
          mapfile -t bundles < <(find candidate -type f -name '*-win-unpacked.tar')
          mapfile -t audits < <(find candidate -type f -name 'steam-bridge-windows-package-audit.json')
          test "${#tarballs[@]}" -eq 1
          test "${#bundles[@]}" -eq 1
          test "${#audits[@]}" -eq 1
          args=(
            --tarball "${tarballs[0]}"
            --bundle-archive "${bundles[0]}"
            --audit-manifest "${audits[0]}"
            --publish
            --release-tag "$RELEASE_TAG"
            --release-commit "$RELEASE_COMMIT"
          )
          if [[ -n "$PREVIOUS_RELEASE_TAG" ]]; then
            mapfile -t previous_tarballs < <(find previous -type f -name 'steam-bridge-*.tgz')
            mapfile -t previous_receipts < <(find previous -type f -name 'windows-live-proof-receipt.json')
            test "${#previous_tarballs[@]}" -eq 1
            test "${#previous_receipts[@]}" -eq 1
            args+=(
              --previous-tarball "${previous_tarballs[0]}"
              --previous-live-proof-receipt "${previous_receipts[0]}"
              --previous-release-tag "$PREVIOUS_RELEASE_TAG"
            )
          else
            args+=(--live-proof-receipt windows-live-proof-receipt.json)
          fi
          if [[ -n "$NPM_TAG" ]]; then
            args+=(--tag "$NPM_TAG")
          fi
          node scripts/publish-release-candidate.cjs "${args[@]}"

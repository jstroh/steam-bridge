name: CI

on:
  push:
  pull_request:

jobs:
  security-audit:
    name: Dependency security audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm audit --package-lock-only --audit-level=moderate
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  check:
    name: Check ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.0
          cache: npm
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: ${{ matrix.target }}
      - if: matrix.target == 'aarch64-apple-darwin'
        run: test "$(uname -m)" = arm64
      - run: node scripts/assert-supported-targets.cjs
      - run: npm ci
      - run: npm test
      - if: matrix.target == 'x86_64-pc-windows-msvc'
        run: node scripts/smoke-package.cjs --windows-cleanup-self-test
      - run: cargo fmt --all --check
      - run: cargo check -p steam-bridge-native --target ${{ matrix.target }}
      - run: npm run api:check

  package-smoke:
    name: Package smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - if: github.ref_type != 'tag'
        run: npm run check:electron:latest
      - run: npm run package:smoke
      - run: mkdir -p dist/node-runtime-compat && npm pack --workspace steam-bridge --pack-destination dist/node-runtime-compat
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: steam-bridge-node-runtime-package
          path: dist/node-runtime-compat/*.tgz

  node-runtime-compat:
    name: Node runtime ${{ matrix.node-version }}
    needs: package-smoke
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18.20.8, 20.19.5, 22.13.0, 24]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: steam-bridge-node-runtime-package
          path: dist/node-runtime-compat
      - run: node scripts/smoke-node-runtime.cjs dist/node-runtime-compat/*.tgz

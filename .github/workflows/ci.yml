name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  security-audit:
    name: Dependency security audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.13.0
          cache: npm
      - name: Use tested build npm
        run: npm install --global npm@11.17.0 --ignore-scripts
      - run: npm run check:build-npm
      - run: npm audit --package-lock-only --audit-level=moderate
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Install pinned Rust audit
        run: cargo install cargo-audit --locked --version 0.23.0
      - name: Audit Rust dependencies
        shell: bash
        run: |
          set -euo pipefail
          test -f Cargo.lock
          cargo audit --json --file ./Cargo.lock | tee cargo-audit.json
          node <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('cargo-audit.json', 'utf8'));
          if (report?.vulnerabilities?.found !== false
            || report.vulnerabilities.count !== 0
            || !Array.isArray(report.vulnerabilities.list)
            || report.vulnerabilities.list.length !== 0
            || !report.warnings || typeof report.warnings !== 'object'
            || Array.isArray(report.warnings)) {
            throw new Error('Rust audit must produce a valid report with no vulnerabilities.');
          }
          NODE
      - name: Retain Rust audit report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: steam-bridge-rust-audit
          path: cargo-audit.json
          if-no-files-found: error

  check:
    name: Check ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.13.0
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}
      - if: matrix.target == 'aarch64-apple-darwin'
        run: test "$(uname -m)" = arm64
      - run: node scripts/assert-supported-targets.cjs
      - name: Use tested build npm
        run: npm install --global npm@11.17.0 --ignore-scripts
      - run: npm run check:build-npm
      - run: npm ci
      - run: npm test
      - if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: STEAM_BRIDGE_REQUIRE_X11_TESTS=1 xvfb-run -a node scripts/run-native-tests.cjs
      - if: matrix.target == 'x86_64-pc-windows-msvc'
        run: node scripts/smoke-package.cjs --windows-cleanup-self-test
      - run: cargo fmt --all --check
      - run: cargo check -p steam-bridge-native --target ${{ matrix.target }}
      - run: npm run api:check

  package-smoke:
    name: Package smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.13.0
          cache: npm
      - name: Use tested build npm
        run: npm install --global npm@11.17.0 --ignore-scripts
      - run: npm run check:build-npm
      - run: npm ci
      - if: github.ref_type != 'tag'
        run: npm run check:electron:latest
      - run: npm run package:smoke
      - run: mkdir -p dist/node-runtime-compat && npm pack --workspace steam-bridge --pack-destination dist/node-runtime-compat
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: steam-bridge-node-runtime-package
          path: dist/node-runtime-compat/*.tgz

  node-runtime-compat:
    name: Node runtime ${{ matrix.node-version }}
    needs: package-smoke
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18.20.8, 20.19.5, 22.13.0, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: steam-bridge-node-runtime-package
          path: dist/node-runtime-compat
      - run: node scripts/smoke-node-runtime.cjs dist/node-runtime-compat/*.tgz

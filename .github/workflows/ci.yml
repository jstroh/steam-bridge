name: CI

on:
  push:
  pull_request:

jobs:
  check:
    name: Check ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: matrix.target == 'aarch64-apple-darwin'
        run: test "$(uname -m)" = arm64
      - run: node scripts/assert-supported-targets.cjs
      - run: npm ci
      - run: npm test
      - if: matrix.target == 'x86_64-pc-windows-msvc'
        run: node scripts/smoke-package.cjs --windows-cleanup-self-test
      - run: cargo fmt --all --check
      - run: cargo check -p steam-bridge-native --target ${{ matrix.target }}
      - run: npm run api:check

  package-smoke:
    name: Package smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - if: github.ref_type != 'tag'
        run: npm run check:electron:latest
      - run: npm run package:smoke
      - run: mkdir -p dist/node-runtime-compat && npm pack --workspace steam-bridge --pack-destination dist/node-runtime-compat
      - uses: actions/upload-artifact@v6
        with:
          name: steam-bridge-node-runtime-package
          path: dist/node-runtime-compat/*.tgz

  node-runtime-compat:
    name: Node runtime ${{ matrix.node-version }}
    needs: package-smoke
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18.20.8, 20.19.5, 22.13.0, 24]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
      - uses: actions/download-artifact@v8
        with:
          name: steam-bridge-node-runtime-package
          path: dist/node-runtime-compat
      - run: node scripts/smoke-node-runtime.cjs dist/node-runtime-compat/*.tgz

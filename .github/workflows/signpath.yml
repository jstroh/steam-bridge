name: Sign Windows native addon

on:
  push:
    tags:
      - "v*"

permissions:
  actions: read
  contents: read

jobs:
  sign-windows-addon:
    name: Build and request SignPath approval
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify immutable release tag
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') {
            throw "release_tag must be an immutable semantic-version tag"
          }
          if ((git status --porcelain).Length -ne 0) {
            throw "Signing checkout is dirty"
          }
          $tagCommit = git rev-list -n 1 $env:RELEASE_TAG
          if ($tagCommit -ne (git rev-parse HEAD) -or $tagCommit -ne $env:GITHUB_SHA) {
            throw "Checked-out commit does not match the requested release tag"
          }
          $packageVersion = node -p "require('./packages/steam-bridge/package.json').version"
          if ("v$packageVersion" -ne $env:RELEASE_TAG) {
            throw "Package version does not match the requested release tag"
          }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.0
          cache: npm
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: x86_64-pc-windows-msvc
      - run: npm ci
      - name: Run release gates
        run: npm test
      - name: Build project-owned native addon
        run: >-
          npx napi build --release --target x86_64-pc-windows-msvc --platform
          --no-js --manifest-path crates/native/Cargo.toml
          --package-json-path packages/steam-bridge/package.json
          --output-dir dist/signpath-build
      - name: Stage signing input with only the project addon
        shell: pwsh
        run: |
          $addons = @(Get-ChildItem -LiteralPath dist/signpath-build -Filter 'steam_bridge_native.win32-x64-msvc.node' -File -Recurse)
          if ($addons.Count -ne 1) {
            throw "Build output must contain exactly one canonical Windows addon"
          }
          New-Item -ItemType Directory -Path dist/signpath-unsigned | Out-Null
          Copy-Item -LiteralPath $addons[0].FullName -Destination dist/signpath-unsigned/steam_bridge_native.win32-x64-msvc.node
          $files = @(Get-ChildItem -LiteralPath dist/signpath-unsigned -File -Recurse)
          if ($files.Count -ne 1 -or $files[0].Name -ne 'steam_bridge_native.win32-x64-msvc.node') {
            throw "SignPath input must contain exactly the project-owned Windows addon"
          }
          if ($files[0].Length -eq 0) {
            throw "Native addon is empty"
          }
          Get-FileHash -LiteralPath $files[0].FullName -Algorithm SHA256
      - name: Upload unsigned GitHub artifact
        id: unsigned
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: steam-bridge-signpath-unsigned-${{ github.ref_name }}
          path: dist/signpath-unsigned/steam_bridge_native.win32-x64-msvc.node
          if-no-files-found: error
      - name: Submit SignPath signing request
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist/signpath-signed
      - name: Verify signed addon
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -LiteralPath dist/signpath-signed -Filter 'steam_bridge_native.win32-x64-msvc.node' -File -Recurse)
          if ($files.Count -ne 1) {
            throw "Expected exactly one signed Steam Bridge addon"
          }
          $signature = Get-AuthenticodeSignature -LiteralPath $files[0].FullName
          if ($signature.Status -ne 'Valid' -or -not $signature.SignerCertificate.Verify()) {
            throw "Signed addon does not have a publicly trusted Authenticode signature"
          }
          if ($signature.SignerCertificate.Subject -notmatch 'SignPath Foundation') {
            throw "Signed addon is not published by SignPath Foundation"
          }
          if (-not $signature.TimeStamperCertificate -or -not $signature.TimeStamperCertificate.Verify()) {
            throw "Signed addon has no publicly trusted timestamp"
          }
          Get-FileHash -LiteralPath $files[0].FullName -Algorithm SHA256
      - name: Upload signed addon
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: steam-bridge-signpath-signed-${{ github.ref_name }}
          path: dist/signpath-signed/steam_bridge_native.win32-x64-msvc.node
          if-no-files-found: error
